[package]
name = "jxr-mpsgraph"
description = "Direct MPSGraph tensor adapter for Metal-resident JPEG XR batches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
j2k-metal-support.workspace = true
jxr = { path = "../jxr", version = "=0.1.1", features = ["metal"] }
jxr-core = { path = "../jxr-core", version = "=0.1.0" }
jxr-metal = { path = "../jxr-metal", version = "=0.1.1" }
thiserror.workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
j2k-mpsgraph-support = "=0.10.0"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "MTLBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLResource",
] }
objc2-metal-performance-shaders = { version = "=0.3.2", default-features = false, features = [
    "MPSCore",
    "MPSCoreTypes",
    "MPSNDArray",
] }
objc2-metal-performance-shaders-graph = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-metal-performance-shaders",
    "MPSGraph",
    "MPSGraphArithmeticOps",
    "MPSGraphCore",
    "MPSGraphMemoryOps",
    "MPSGraphOperation",
    "MPSGraphReductionOps",
    "MPSGraphTensor",
    "MPSGraphTensorData",
    "MPSGraphTensorShapeOps",
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
undocumented_unsafe_blocks = "warn"

[[test]]
name = "contracts"

[[test]]
name = "metal"

[[bench]]
name = "direct_handoff"
harness = false
test = false
