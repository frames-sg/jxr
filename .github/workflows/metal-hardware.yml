name: Metal hardware

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed JXR commit SHA; leave empty to test main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: metal-hardware
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'jcwal1516' && github.triggering_actor == 'jcwal1516' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Validate revision and report pending Metal status
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          DEFAULT_REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          revision="${REQUESTED_REVISION:-$DEFAULT_REVISION}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "A full lowercase commit SHA is required" >&2; exit 1; }
          resolved="$(gh api "repos/$REPOSITORY/commits/$revision" --jq .sha)"
          [[ "$resolved" == "$revision" ]]
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$REPOSITORY/statuses/$revision" \
            -f state=pending -f context=metal \
            -f description="Owner-triggered Metal hardware validation running" \
            -f target_url="$RUN_URL" --silent

  apple-silicon:
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'jcwal1516' && github.triggering_actor == 'jcwal1516' }}
    runs-on: [self-hosted, macOS, ARM64, metal]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Prepare T.834 vectors
        run: tools/t834-conformance/build.sh
      - name: Build T.835 oracle
        run: tools/t835-oracle/build.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test full workspace
        run: cargo test --workspace --all-features
      - name: Test without default features
        run: cargo test -p jxr --no-default-features
      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - name: Test MPSGraph device lifecycle
        run: cargo test -p jxr-mpsgraph --test metal -- --ignored --test-threads=1
      - name: Run CPU conformance
        id: cpu-conformance
        continue-on-error: true
        run: >-
          cargo run -p jxr-test-support --bin jxr-t834 --
          --backend cpu
          --report target/t834-conformance/reports/ci-cpu.tsv
      - name: Run Annex-A writer conformance
        id: writer-conformance
        continue-on-error: true
        run: >-
          cargo run -p jxr-test-support --bin jxr-t834 --
          --backend cpu
          --rewrap
          --report target/t834-conformance/reports/ci-annex-a-writer.tsv
      - name: Run Metal conformance
        id: metal-conformance
        continue-on-error: true
        run: >-
          cargo run -p jxr-test-support --features metal --bin jxr-t834 --
          --backend metal
          --report target/t834-conformance/reports/ci-metal.tsv
      - name: Run pathology batch benchmark
        shell: bash
        run: |
          mkdir -p target/t834-conformance/reports
          set -o pipefail
          cargo run -p jxr-test-support --features metal --bin jxr-pathology-bench |
            tee target/t834-conformance/reports/pathology-bench.txt
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpeg-xr-metal-hardware-reports
          path: |
            target/t834-conformance/reports/ci-cpu.tsv
            target/t834-conformance/reports/ci-annex-a-writer.tsv
            target/t834-conformance/reports/ci-metal.tsv
            target/t834-conformance/reports/pathology-bench.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce conformance results
        if: ${{ always() && (steps.cpu-conformance.outcome == 'failure' || steps.writer-conformance.outcome == 'failure' || steps.metal-conformance.outcome == 'failure') }}
        run: exit 1

  report:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'jcwal1516' && github.triggering_actor == 'jcwal1516') && needs.prepare.result == 'success' }}
    needs: [prepare, apple-silicon]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report exact-revision Metal result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          RESULT: ${{ needs.apple-silicon.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$REPOSITORY/statuses/$REVISION" \
            -f state="$state" -f context=metal \
            -f description="Metal hardware validation: $RESULT" \
            -f target_url="$RUN_URL" --silent
