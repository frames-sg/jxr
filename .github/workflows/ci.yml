name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        # Standard macOS VMs expose an unsupported virtual Metal device.
        # The xlarge Apple-silicon runner provides GPU hardware acceleration.
        os: [ubuntu-latest, macos-15-xlarge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p jxr --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path crates/jxr/fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/jxr/fuzz/Cargo.toml --all-targets -- -D warnings
