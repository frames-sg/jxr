name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup component add rustfmt clippy
      - name: Take the latest J2K main
        run: cargo latest
      - run: python3 tools/test_corpus_build.py
      - run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check crates/jxr-cuda/src/kernels/main.rs
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p jxr --no-default-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
      - name: Check the size of the decode-only WebAssembly module
        run: |
          rustup target add wasm32-unknown-unknown
          python3 tools/wasm_size_check.py

  # The owner-triggered Metal hardware workflow reports status "metal" on the tested commit.

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup component add rustfmt clippy
      - name: Take the latest J2K main
        run: cargo latest && cargo latest --manifest-path crates/jxr/fuzz/Cargo.toml
      - run: cargo fmt --manifest-path crates/jxr/fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/jxr/fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Run the encode round-trip harness on its fixed cases
        run: cargo test --release --manifest-path crates/jxr/fuzz/Cargo.toml
